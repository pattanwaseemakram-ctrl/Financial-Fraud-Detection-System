<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intelligent Fraud Detection System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app-container">
        <header class="navbar">
            <div class="logo">
                <span class="icon">🛡️</span>
                <h2>Intelligent Fraud Detection System</h2>
            </div>
            <div class="status-pill"><span class="pulse"></span> Scoring Engine: Active</div>
        </header>

        <main class="dashboard-grid">
            <div class="kpi-card">
                <h4>Total Analyzed</h4>
                <p id="kpi-total">1,048,575</p>
            </div>
            <div class="kpi-card danger">
                <h4>Fraud Intercepted</h4>
                <p id="kpi-fraud">8,213</p>
            </div>
            <div class="kpi-card success">
                <h4>Protected Value</h4>
                <p id="kpi-value">$12,050,000</p>
            </div>
            <div class="kpi-card info">
                <h4>Model Sensitivity (Recall)</h4>
                <p id="kpi-recall">97.2%</p>
            </div>

            <!-- Transaction Simulator Form -->
            <section class="card simulator-card">
                <h3>⚡ PaySim Real-Time Transaction Risk Analyzer</h3>
                <form id="tx-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label>User / Customer ID (nameOrig)</label>
                            <input type="text" id="user_id" value="C1231006815" required>
                        </div>
                        <div class="form-group">
                            <label>Amount ($)</label>
                            <input type="number" id="amount" value="9839.64" step="0.01" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Transaction Type (merchant_category)</label>
                            <select id="merchant_category">
                                <option value="TRANSFER" selected>TRANSFER (High Risk)</option>
                                <option value="CASH_OUT">CASH_OUT (High Risk)</option>
                                <option value="PAYMENT">PAYMENT (Standard)</option>
                                <option value="CASH_IN">CASH_IN (Legitimate)</option>
                                <option value="DEBIT">DEBIT (Standard)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Recipient / Destination (location)</label>
                            <select id="location">
                                <option value="Transfer_Acc" selected>Transfer_Acc (Suspicious)</option>
                                <option value="Online">Online Merchant (M...)</option>
                                <option value="Lagos, NG">Lagos, NG (Overseas)</option>
                                <option value="Moscow, RU">Moscow, RU (Unusual)</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" class="btn-primary">Analyze Risk Score</button>
                </form>

                <div id="result-box" class="result-box hidden">
                    <div class="risk-badge" id="risk-badge">HIGH RISK</div>
                    <h3 id="risk-score">Risk Score: 92.4%</h3>
                    <p id="action-taken">Action: BLOCKED_IMMEDIATE_ALERT</p>
                    <ul id="audit-flags"></ul>
                </div>
            </section>
        </main>
    </div>
    <script src="/static/js/dashboard.js"></script>
</body>
</html>
